[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsec-mirror-backend"
version = "0.1.0"
description = "FastAPI backend for OPSEC Mirror"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.122.0",
  "httpx>=0.28.1",
  "openai>=2.11.0",
  "mercantile>=1.2.1",
  "numpy>=1.26.0",
  "Pillow>=10.4.0",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "skyfield>=1.53",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.collectors",
  "app.models",
  "app.palantir",
  "app.storage",
  "app.synthesis",
  "app.utils"
]
